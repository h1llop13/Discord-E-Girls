services:
  postgres:
    image: postgres:16-alpine
    container_name: discord-egirls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord_bot
      POSTGRES_DB: discord_bot
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - discord_egirls_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot -d discord_bot"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  discord_egirls_postgres_data:
